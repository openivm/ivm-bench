# =============================================================================
# GCI: GATED CHECK-IN
# - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
# - Runs on non-draft same-repo PRs, every push to main, and manual dispatch
#   from the default branch.
# - SF10 TPC-DI on local engines only. No cloud engines, so no cloud flakes.
# - PRs run only the engines their diff can affect (tools/scripts/github/
#   select-engines.py + engine-impact.json). Shared/framework or unclassified
#   paths, or most local engines affected, run every local engine. Label a PR
#   `gci-full` and re-run to force the full suite.
# - Main pushes and dispatches always run every local engine and publish the
#   dashboard; each main push queues in its own concurrency group.
# - Only full runs publish the dashboard; subset runs never do.
# - `benchmark / benchmark` is the required check: it is the gate job below.
# - Need cloud engines or custom settings? Run ci.yaml instead.
# =============================================================================
name: GCI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && format('push-{0}', github.run_id) || format('manual-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  pull-requests: write
  actions: read
  contents: write

jobs:
  changes:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
       github.repository == 'openivm/ivm-bench' &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      engines: ${{ steps.select.outputs.engines }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "$(grep -h '^sqlglot' src/containers/benchmark-server/requirements.txt)"
      - name: Select engines
        id: select
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          args=()
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            args+=(--base "$BASE" --head "$HEAD")
            if ! labels=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/labels" --jq '.[].name'); then
              args+=(--force-full)
            elif grep -qx gci-full <<<"$labels"; then
              args+=(--force-full)
            fi
          fi
          python tools/scripts/github/select-engines.py "${args[@]}"

  engines:
    needs: changes
    if: needs.changes.outputs.mode != 'none'
    uses: ./.github/workflows/ci.yaml
    with:
      experiments_file: src/containers/benchmark-server/experiments/gci-sf10-local-engines.json
      experiments_engines: ${{ needs.changes.outputs.mode == 'subset' && needs.changes.outputs.engines || '' }}
      pr_number: ${{ github.event_name == 'pull_request' && format('{0}', github.event.pull_request.number) || '' }}
      publish_dashboard: ${{ needs.changes.outputs.mode == 'full' }}
    secrets: inherit

  checks:
    needs: changes
    if: needs.changes.outputs.mode == 'none'
    runs-on: [self-hosted, Linux, X64, ivm-bench-azure]
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - run: bash tools/scripts/github/run-unit-tests.sh

  gate:
    name: benchmark / benchmark
    needs: [changes, engines, checks]
    if: always() && needs.changes.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          MODE: ${{ needs.changes.outputs.mode }}
          ENGINES: ${{ needs.engines.result }}
          CHECKS: ${{ needs.checks.result }}
        run: |
          echo "changes=$CHANGES mode=$MODE engines=$ENGINES checks=$CHECKS"
          [[ "$CHANGES" == success ]] || exit 1
          if [[ "$MODE" == none ]]; then
            [[ "$CHECKS" == success && "$ENGINES" == skipped ]]
          else
            [[ "$ENGINES" == success && "$CHECKS" == skipped ]]
          fi
